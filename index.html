    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; }
        #map { z-index: 1; }
        
        .custom-pin {
            width: 32px;
            height: 32px;
            border-radius: 50% 50% 50% 0;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -16px 0 0 -16px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .custom-pin::after {
            content: '';
            width: 24px;
            height: 24px;
            margin: 4px 0 0 4px;
            background: #fff;
            position: absolute;
            border-radius: 50%;
        }
        .pin-text {
            position: absolute;
            width: 32px;
            font-size: 14px;
            font-weight: 900;
            text-align: center;
            top: -10px;
            left: -16px;
            z-index: 10;
        }
        
        /* Categories */
        .color-명소 { background: #0284c7; } 
        .text-명소 { color: #0284c7; }
        .color-식당 { background: #ea580c; } 
        .text-식당 { color: #ea580c; }
        .color-숙소 { background: #4f46e5; } 
        .text-숙소 { color: #4f46e5; }
        .color-교통 { background: #059669; } 
        .text-교통 { color: #059669; }
        
        /* Highlight Pin Outline */
        .highlight-pin {
            border: 2px solid #eab308 !important; /* yellow-500 */
            box-shadow: 0 0 8px rgba(234, 179, 8, 0.8) !important;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .spot-item { position: relative; }
        .timeline-line {
            position: absolute;
            left: 21px; 
            top: 32px;
            bottom: -8px;
            width: 2px;
            background-color: #cbd5e1;
            z-index: 0;
        }

        .day-card.active {
            border-color: #0284c7;
            background-color: #f0f9ff;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .day-details {
            display: none;
        }
        .day-card.active .day-details {
            display: block;
        }
        
        .spot-item:hover .spot-number {
            transform: scale(1.15);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

            .timeline-line {
                left: 19px;

            }
        }

                html: `<div class="custom-pin color-${category} ${hClass}"></div><span class="pin-text text-${category}">${index}</span>`,

                iconAnchor: [16, 42],

            });

        function renderAllDays() {
            currentLayerGroup.clearLayers();
            currentMarkers = [];
            document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
            activeCard = null;
            
            let allPoints = [];
            dailyData.forEach((day, dayIndex) => {
                if(day.spots.length > 0) {
                    let mainSpot = day.spots[0];
                    const hotel = day.spots.find(s => s.category === '숙소');
                    if(hotel) mainSpot = hotel;
                    
                    const marker = L.marker([mainSpot.lat, mainSpot.lng], {
                        icon: L.divIcon({

                    marker.bindPopup(`<div class="font-bold text-sm">Day ${day.day}: ${day.city}</div><div class="text-xs">${day.title}</div>`);

                    allPoints.push([mainSpot.lat, mainSpot.lng]);
                }
            });
            if(allPoints.length > 0) {
                L.polyline(allPoints, { color: '#0ea5e9', weight: 2, opacity: 0.5, dashArray: '5,5' }).addTo(currentLayerGroup);
                map.fitBounds(currentLayerGroup.getBounds().pad(0.1));
            }
        }

        function getRoutingUrl(startSpot, endSpot) {
            // Determine travel mode based on description or transport
            let mode = 'walking'; // Default
            const transportText = (startSpot.transport || '') + ' ' + (startSpot.desc || '');
            
            if (transportText.includes('🚗') || transportText.includes('택시') || transportText.includes('차량') || transportText.includes('렌터카')) {
                mode = 'driving';
            } else if (transportText.includes('🚌') || transportText.includes('버스') || transportText.includes('🚇') || transportText.includes('지하철') || transportText.includes('🚆') || transportText.includes('기차') || transportText.includes('대중교통')) {
                mode = 'transit';
            }

            const origin = `${startSpot.lat},${startSpot.lng}`;
            const dest = `${endSpot.lat},${endSpot.lng}`;
            
            return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=${mode}`;
        }

                        ${pdfLinkHtml}
                        ${routingLink}
                    </div>
                `);

            const headerHtml = `
                <div class="p-3 md:p-4 flex items-start gap-2.5 md:gap-3 pointer-events-none">
                    <div class="flex-shrink-0 w-12 md:w-14 text-center mt-0.5 md:mt-0">
                        <div class="text-[9px] md:text-[10px] font-bold text-slate-400 uppercase leading-none mb-1">Day ${day.day}</div>
                        <div class="text-[14px] md:text-[16px] font-black text-sky-700 leading-none">${day.date.split(' ')[0]}</div>
                        <div class="text-[10px] md:text-xs font-bold text-sky-500 mt-1">${day.date.split(' ')[1] || ''}</div>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-0.5 md:mb-1">
                            <span class="text-[9px] md:text-[11px] font-bold bg-slate-100 text-slate-600 px-1.5 md:px-2 py-0.5 rounded-md"><i class="fa-solid fa-location-dot mr-1"></i>${day.city}</span>
                        </div>
                        <h3 class="text-xs md:text-sm font-bold text-slate-800 leading-snug">${day.title}</h3>
                        <p class="text-[10px] md:text-[11px] text-slate-500 mt-1"><i class="fa-solid fa-route mr-1"></i>${day.desc}</p>
                    </div>
                </div>
            `;
            
            let mode = 'walking';
            const dayTransport = day.transport || '';
            if (dayTransport.includes('🚗')) mode = 'driving';
            else if (dayTransport.includes('🚌') || dayTransport.includes('🚇') || dayTransport.includes('🚆')) mode = 'transit';

            let routingButtonsHtml = '';
            
            if (day.spots.length <= 10) {
                routingButtonsHtml = `
                    <div class="px-2 md:px-2 pt-2 md:pt-3 pb-0 flex">
                        <button onclick="event.stopPropagation(); window.open(getGoogleMapsUrl(${dayIndex}, 0, ${day.spots.length - 1}, '${mode}'), '_blank')" class="w-full py-2 bg-[#4285F4] hover:bg-blue-700 text-white text-[11px] md:text-xs font-bold rounded shadow-sm transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-map-location-dot"></i> 구글 지도로 하루 동선 한 번에 보기
                        </button>
                    </div>
                `;
            } else {
                let midIndex = 9;
                routingButtonsHtml = `
                    <div class="px-2 md:px-2 pt-2 md:pt-3 pb-0 flex gap-1.5 md:gap-2">
                        <button onclick="event.stopPropagation(); window.open(getGoogleMapsUrl(${dayIndex}, 0, ${midIndex}, '${mode}'), '_blank')" class="flex-1 py-2 bg-[#4285F4] hover:bg-blue-700 text-white text-[10px] md:text-xs font-bold rounded shadow-sm transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-map-location-dot"></i> 오전 경로 보기
                        </button>
                        <button onclick="event.stopPropagation(); window.open(getGoogleMapsUrl(${dayIndex}, ${midIndex}, ${day.spots.length - 1}, '${mode}'), '_blank')" class="flex-1 py-2 bg-[#34A853] hover:bg-green-700 text-white text-[10px] md:text-xs font-bold rounded shadow-sm transition flex items-center justify-center gap-1">
                            <i class="fa-solid fa-map-location-dot"></i> 오후 경로 보기
                        </button>
                    </div>
                `;
            }
            
            let detailsHtml = `<div class="day-details bg-slate-50 border-t border-slate-100">
                ${routingButtonsHtml}
                <div class="px-2 md:px-2 py-2 md:py-3">`;

            day.spots.forEach((spot, idx) => {
                const isLast = idx === day.spots.length - 1;
                
                // Highlight styling logic
                const highlightBg = spot.highlight ? "bg-yellow-50 border border-yellow-200 shadow-sm" : "hover:bg-sky-100";
                const highlightIcon = spot.highlight ? `<i class="fa-solid fa-star text-yellow-500 ml-1" title="필수 명소"></i>` : "";
                
                detailsHtml += `
                    <div class="spot-item relative p-2 md:p-2.5 rounded-lg transition ${highlightBg} cursor-pointer group" onclick="focusSpot(event, ${idx})">
                        ${!isLast ? '<div class="timeline-line"></div>' : ''}
                        <div class="flex gap-2.5 md:gap-3 relative z-10">
                            <div class="spot-number w-5 h-5 md:w-6 md:h-6 rounded-full flex-shrink-0 color-${spot.category} text-white flex items-center justify-center text-[9px] md:text-[10px] font-bold shadow-sm border border-white mt-0.5 md:mt-0 transition duration-200">
                                ${idx + 1}
                            </div>
                            <div class="flex-1 pb-1">
                                <div class="flex items-center gap-1.5 md:gap-2">
                                    <span class="text-[9px] md:text-[11px] font-bold text-slate-400 font-mono">${spot.time}</span>
                                    <span class="text-[11px] md:text-[13px] font-bold text-slate-800 group-hover:text-sky-700 transition">${spot.name}${highlightIcon}</span>
                                </div>
                                <p class="text-[10px] md:text-xs text-slate-500 mt-0.5 leading-snug">${spot.transport}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            detailsHtml += `</div></div>`;
            card.innerHTML = headerHtml + detailsHtml;
            card.addEventListener('click', (e) => {
                if (card.classList.contains('active')) {
                    renderAllDays();
                } else {
                    renderDayDetails(day, card);
                    setTimeout(() => { card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 100);
                }
            });
            listContainer.appendChild(card);
        });

        document.getElementById('btn-show-all').addEventListener('click', renderAllDays);
        renderAllDays();
    </script>
</body>
</html>
